# `docker compose up --build` gives you Postgres+PostGIS, Redis and the API with seed data.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: hstaff
      POSTGRES_PASSWORD: hstaff
      POSTGRES_DB: hstaff
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hstaff -d hstaff']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ['4000:4000']
    environment:
      # development mode: demo users are seeded and files go to the local-disk fallback (no Supabase needed)
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://hstaff:hstaff@postgres:5432/hstaff
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      OTP_PROVIDER: console
      NOMINATIM_USER_AGENT: hstaff-dev (you@example.com)
      PAYMENT_PROVIDER: simulated
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,http://localhost:3000
      API_PUBLIC_URL: http://localhost:4000
    # migrate -> seed (idempotent) -> start
    command: >
      sh -c "node_modules/.bin/knex --knexfile knexfile.cjs migrate:latest &&
             node_modules/.bin/knex --knexfile knexfile.cjs seed:run &&
             node dist/server.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports: ['5173:5173']
    environment:
      VITE_BACKEND_URL: http://api:4000
      PORT: 5173

volumes:
  pgdata:
