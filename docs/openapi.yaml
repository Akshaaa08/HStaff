openapi: 3.0.3
info:
  title: H-Staff API
  version: 0.1.0
  description: "Hourly staffing marketplace backend. Success: `{ data, meta }`. Errors: `{ error: { code, message, details } }` with 400 validation, 401 auth, 403 role/ownership, 404, 409 conflict or illegal state transition, 429 rate/lockout. Money is a string with 2 decimals. Realtime events (Socket.IO): shift:requested, shift:updated, shift:otp, worker:location, timesheet:ready, notification:new."
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
    Session:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        user:
          $ref: "#/components/schemas/User"
        is_new_user:
          type: boolean
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          enum:
            - client
            - worker
            - admin
        admin_role:
          enum:
            - super_admin
            - verifier
            - finance
            - support
            - null
          nullable: true
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        photo_url:
          type: string
        status:
          enum:
            - ACTIVE
            - SUSPENDED
    OtpRequest:
      type: object
      properties:
        phone:
          type: string
          example: "+919876543210"
          description: E.164, or a 10-digit Indian mobile
        role:
          enum:
            - client
            - worker
          description: '"customer" and "professional" are accepted as aliases'
      required:
        - phone
        - role
    OtpVerify:
      type: object
      properties:
        phone:
          type: string
        otp:
          type: string
          example: "123456"
        role:
          enum:
            - client
            - worker
        name:
          type: string
          description: Used only when this call creates the account
      required:
        - phone
        - otp
        - role
    AdminLogin:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    Refresh:
      type: object
      properties:
        refresh_token:
          type: string
      required:
        - refresh_token
    Logout:
      type: object
      properties:
        refresh_token:
          type: string
        push_token:
          type: string
    PushToken:
      type: object
      properties:
        token:
          type: string
          example: ExponentPushToken[xxxx]
      required:
        - token
    UpdateMe:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
    WorkerProfileUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        bio:
          type: string
        experience_years:
          type: integer
        hourly_rate:
          type: number
        equipment:
          type: string
        skill_ids:
          type: array
          items:
            type: integer
        upi_id:
          type: string
        age:
          type: integer
    Online:
      type: object
      properties:
        online:
          type: boolean
        lat:
          type: number
        lng:
          type: number
        mocked:
          type: boolean
          description: Android mock-location flag; true is rejected
        accuracy_m:
          type: number
          description: Above 200 m is rejected
      required:
        - online
    Location:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        mocked:
          type: boolean
          description: Android mock-location flag; true is rejected
        accuracy_m:
          type: number
          description: Above 200 m is rejected
      required:
        - lat
        - lng
    KycUpload:
      type: object
      properties:
        doc_type:
          enum:
            - AADHAAR
            - PAN
            - VOTER_ID
            - DRIVING_LICENCE
            - PASSPORT
            - SELFIE
            - OTHER
        file:
          type: string
          format: binary
          description: JPG, PNG, WebP or PDF, max 5 MB
      required:
        - doc_type
        - file
    PhotoUpload:
      type: object
      properties:
        photo:
          type: string
          format: binary
      required:
        - photo
    CreateShift:
      type: object
      properties:
        mode:
          enum:
            - DIRECT
            - OPEN
          default: DIRECT
        worker_id:
          type: string
          format: uuid
          description: Required for DIRECT, forbidden for OPEN
        skill_id:
          type: integer
        title:
          type: string
        description:
          type: string
        materials:
          type: string
        is_instant:
          type: boolean
        start_at:
          type: string
          format: date-time
          description: Scheduled shifts only; must be in the future
        end_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          description: 30 to 720. Required when is_instant, otherwise an alternative to end_at
        address:
          type: string
        lat:
          type: number
        lng:
          type: number
        hourly_rate:
          type: number
          description: "OPEN only: the client's offer. For DIRECT the rate always comes from the worker profile and this field is ignored."
      required:
        - skill_id
        - address
        - lat
        - lng
    Reason:
      type: object
      properties:
        reason:
          type: string
      required:
        - reason
    Reassign:
      type: object
      properties:
        worker_id:
          type: string
          format: uuid
          description: Omit to reopen an OPEN shift
    EnRoute:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
    Arrive:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
        mocked:
          type: boolean
          description: Android mock-location flag; true is rejected
        accuracy_m:
          type: number
          description: Above 200 m is rejected
      required:
        - lat
        - lng
    OtpCheckin:
      type: object
      properties:
        otp:
          type: string
          example: "123456"
        lat:
          type: number
        lng:
          type: number
        mocked:
          type: boolean
          description: Android mock-location flag; true is rejected
        accuracy_m:
          type: number
          description: Above 200 m is rejected
      required:
        - otp
        - lat
        - lng
    Dispute:
      type: object
      properties:
        reason:
          type: string
        evidence:
          type: array
          items:
            type: string
            format: binary
          description: Up to 3 files (multipart only)
      required:
        - reason
    VerifyPayment:
      type: object
      properties:
        provider_order_id:
          type: string
        provider_payment_id:
          type: string
        signature:
          type: string
        result:
          enum:
            - success
            - failure
          description: Simulated gateway only
      required:
        - provider_order_id
    Review:
      type: object
      properties:
        shiftId:
          type: string
          format: uuid
        stars:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
        comment:
          type: string
      required:
        - shiftId
        - stars
    Shift:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
        status:
          enum:
            - OPEN
            - REQUESTED
            - ACCEPTED
            - EN_ROUTE
            - ARRIVED
            - IN_PROGRESS
            - AWAITING_APPROVAL
            - APPROVED
            - PAID
            - DECLINED
            - EXPIRED
            - CANCELLED
            - DISPUTED
        title:
          type: string
        skill:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        is_instant:
          type: boolean
        scheduled_minutes:
          type: integer
        address:
          type: string
          nullable: true
          description: Hidden from a worker until they accept
        location:
          type: object
          properties:
            lat:
              type: number
            lng:
              type: number
        distance_m:
          type: integer
        hourly_rate:
          type: string
          example: "312.50"
          description: numeric(10,2) as a string, never a float
        request_expires_at:
          type: string
          format: date-time
        client:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            photo_url:
              type: string
        worker:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            rating_avg:
              type: string
        pricing:
          type: object
          properties:
            estimate:
              type: boolean
            billable_minutes:
              type: integer
            gross:
              type: string
              example: "312.50"
              description: numeric(10,2) as a string, never a float
            commission_pct:
              type: number
            commission:
              type: string
              example: "312.50"
              description: Workers only
            worker_payout:
              type: string
              example: "312.50"
              description: Workers only
        timesheet:
          type: object
          properties:
            clock_in_at:
              type: string
              format: date-time
            clock_out_at:
              type: string
              format: date-time
            verified_minutes:
              type: integer
            billable_minutes:
              type: integer
            approval_deadline:
              type: string
              format: date-time
            status:
              type: string
        pending_otp:
          enum:
            - start
            - end
            - null
          nullable: true
    VerifyWorker:
      type: object
      properties:
        decision:
          enum:
            - APPROVED
            - REJECTED
            - NEEDS_INFO
        note:
          type: string
          description: Required for REJECTED / NEEDS_INFO
      required:
        - decision
    UserStatus:
      type: object
      properties:
        status:
          enum:
            - ACTIVE
            - SUSPENDED
        reason:
          type: string
      required:
        - status
    DisputePatch:
      type: object
      properties:
        status:
          enum:
            - IN_REVIEW
            - RESOLVED
            - ESCALATED
        resolution:
          type: string
        shift_outcome:
          enum:
            - APPROVE
            - CANCEL
          description: Required when resolving a DISPUTED shift
      required:
        - status
    ReviewPatch:
      type: object
      properties:
        hidden:
          type: boolean
      required:
        - hidden
    SkillBody:
      type: object
      properties:
        name:
          type: string
        active:
          type: boolean
    Config:
      type: object
      properties:
        commission_pct:
          type: number
        geofence_m:
          type: number
        request_ttl_min:
          type: number
        approval_sla_hours:
          type: number
    Announcement:
      type: object
      properties:
        title:
          type: string
        body:
          type: string
        audience:
          enum:
            - all
            - clients
            - workers
      required:
        - title
        - body
    AdminCreate:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 10
        name:
          type: string
        admin_role:
          enum:
            - super_admin
            - verifier
            - finance
            - support
      required:
        - email
        - password
        - name
        - admin_role
    AdminPatch:
      type: object
      properties:
        admin_role:
          type: string
        status:
          type: string
        password:
          type: string
        name:
          type: string
paths:
  /health:
    get:
      tags:
        - System
      summary: Liveness and dependency check (db, redis)
      description: No authentication.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/auth/otp/request:
    post:
      tags:
        - Auth
      summary: Send a login OTP (max 3 per 10 min per phone)
      description: No authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/auth/otp/verify:
    post:
      tags:
        - Auth
      summary: Verify OTP; creates the account on first use (201). 5 wrong tries lock the number for 15 min
      description: No authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerify"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Session"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/auth/admin/login:
    post:
      tags:
        - Auth
      summary: Admin email + password login
      description: No authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLogin"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Session"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate the refresh token. Reusing an old one revokes the whole family
      description: No authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Refresh"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Session"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the refresh token and optionally remove a push token
      description: "Requires a bearer token. Allowed: **any**."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Logout"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/devices/push-token:
    post:
      tags:
        - Auth
      summary: Register an Expo push token (idempotent)
      description: "Requires a bearer token. Allowed: **any**."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushToken"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/users/me:
    get:
      tags:
        - Users
      summary: Current user
      description: "Requires a bearer token. Allowed: **any**."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    put:
      tags:
        - Users
      summary: Update name / email
      description: "Requires a bearer token. Allowed: **any**."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMe"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/users/me/photo:
    post:
      tags:
        - Users
      summary: Upload a profile photo (public bucket)
      description: "Requires a bearer token. Allowed: **any**."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUpload"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/skills:
    get:
      tags:
        - Skills
      summary: Active skill categories
      description: No authentication.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
  /api/v1/workers/me:
    get:
      tags:
        - Workers
      summary: Own profile, skills, verification status
      description: "Requires a bearer token. Allowed: **worker**."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    put:
      tags:
        - Workers
      summary: Update profile, rate, equipment, skills, UPI ID
      description: "Requires a bearer token. Allowed: **worker**."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/workers/me/photo:
    post:
      tags:
        - Workers
      summary: Upload a profile photo
      description: "Requires a bearer token. Allowed: **worker**."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PhotoUpload"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/workers/me/kyc:
    get:
      tags:
        - Workers
      summary: List uploaded KYC documents (never returns URLs)
      description: "Requires a bearer token. Allowed: **worker**."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Workers
      summary: Upload a KYC document to the private bucket
      description: "Requires a bearer token. Allowed: **worker**."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/KycUpload"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/workers/me/online:
    post:
      tags:
        - Workers
      summary: Go online/offline. 403 NOT_VERIFIED unless the profile is APPROVED
      description: "Requires a bearer token. Allowed: **worker**."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Online"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /api/v1/workers/me/location:
    post:
      tags:
        - Workers
      summary: Foreground location ping (written at most every 5 s; others return throttled:true)
      description: "Requires a bearer token. Allowed: **worker**."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Location"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                  meta:
                    type: object
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
